<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaron Gogna — Lead Product Manager, New User Experience | Hinge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --bg-card: #111111;
  --text: #ffffff;
  --text-muted: #999999;
  --text-dim: #666666;
  --border: rgba(255,255,255,0.1);
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  font-size: 16px;
  background: var(--bg);
}

body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

::selection {
  background: #ffffff;
  color: #000000;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

/* ── NAVIGATION ── */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 1.25rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
}

.nav-logo span { color: var(--text-muted); }

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
  align-items: center;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.3s;
}

.nav-links a:hover { color: var(--text); }

/* ── HEADER ── */
.page-header {
  padding: 8rem 3rem 2rem;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  opacity: 0;
  animation: fade-up 0.8s ease 0.2s forwards;
}

.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.page-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.03em;
  margin-bottom: 1rem;
  color: #ffffff;
}

.page-title em {
  font-style: italic;
  color: #ffffff;
}

.page-sub {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text-muted);
  max-width: 640px;
  margin-bottom: 1.5rem;
}

/* ── DOWNLOAD BUTTON ── */
.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.8rem 1.8rem;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: 8px;
  transition: all 0.3s ease;
  letter-spacing: 0.02em;
  background: #ffffff;
  color: #000000;
  border: 1px solid #ffffff;
}

.download-btn:hover {
  background: transparent;
  color: #ffffff;
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255, 255, 255, 0.1);
}

.download-icon {
  font-size: 1.1rem;
}

/* ── PDF VIEWER ── */
.pdf-container {
  padding: 0 3rem 4rem;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
  opacity: 0;
  animation: fade-up 0.8s ease 0.4s forwards;
}

#pdf-viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

#pdf-viewer canvas,
.pdf-page-placeholder {
  width: 100%;
  height: auto;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  overflow: hidden;
}

.pdf-loading {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
  font-size: 0.95rem;
}

/* ── FOOTER ── */
footer {
  padding: 2rem 3rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  color: var(--text-dim);
  max-width: 100%;
}

footer a {
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.3s;
}

footer a:hover { color: #ffffff; }

/* ── CONTACT SECTION ── */
.contact-section {
  padding: 4rem 3rem;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  border-top: 1px solid var(--border);
}

.contact-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 2rem;
  color: #ffffff;
}

.contact-links {
  display: flex;
  gap: 3rem;
  flex-wrap: wrap;
}

.contact-item {
  text-decoration: none;
  transition: opacity 0.3s;
}

.contact-item:hover { opacity: 0.7; }

.contact-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}

.contact-value {
  display: block;
  font-size: 0.95rem;
  color: #ffffff;
  font-weight: 500;
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  nav { padding: 1rem 1.5rem; }
  .nav-links { display: none; }
  .page-header { padding: 6rem 1.5rem 1.5rem; }
  .pdf-container { padding: 0 1.5rem 3rem; }
  footer { flex-direction: column; gap: 0.5rem; text-align: center; }
}

@media (max-width: 600px) {
  .pdf-container { padding: 0 1rem 2rem; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>

<!-- HEADER -->
<div class="page-header">

<!-- PDF VIEWER -->
<div class="pdf-container">
  <div id="pdf-viewer">
    <div class="pdf-loading">Loading PDF…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function() {
  var url = 'Aaron-Gogna-for-Hinge-May-2026.pdf';
  var container = document.getElementById('pdf-viewer');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Lower scale on mobile to save memory
  var isMobile = window.innerWidth < 768;
  var scale = isMobile ? 1.5 : 2;

  pdfjsLib.getDocument(url).promise.then(function(pdf) {
    container.innerHTML = '';
    var totalPages = pdf.numPages;
    var rendered = {};

    // Create placeholder divs for each page
    for (var i = 1; i <= totalPages; i++) {
      var wrapper = document.createElement('div');
      wrapper.className = 'pdf-page-placeholder';
      wrapper.setAttribute('data-page', i);
      container.appendChild(wrapper);
    }

    // Set placeholder heights using first page dimensions
    pdf.getPage(1).then(function(firstPage) {
      var vp = firstPage.getViewport({ scale: scale });
      var aspectRatio = vp.height / vp.width;
      var placeholders = container.querySelectorAll('.pdf-page-placeholder');
      for (var j = 0; j < placeholders.length; j++) {
        placeholders[j].style.width = '100%';
        placeholders[j].style.paddingBottom = (aspectRatio * 100) + '%';
        placeholders[j].style.position = 'relative';
      }

      // Render first 3 pages immediately
      for (var k = 1; k <= Math.min(3, totalPages); k++) {
        renderPage(k);
      }

      // Lazy-load remaining pages on scroll
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var pageNum = parseInt(entry.target.getAttribute('data-page'));
            if (!rendered[pageNum]) {
              renderPage(pageNum);
            }
          }
        });
      }, { rootMargin: '600px' });

      placeholders.forEach(function(el) {
        var pn = parseInt(el.getAttribute('data-page'));
        if (pn > 3) observer.observe(el);
      });
    });

    function renderPage(num) {
      if (rendered[num]) return;
      rendered[num] = true;
      pdf.getPage(num).then(function(page) {
        var viewport = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        var wrapper = container.querySelector('[data-page="' + num + '"]');
        if (wrapper) {
          wrapper.appendChild(canvas);
          page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport });
        }
      });
    }
  }).catch(function() {
    container.innerHTML = '<p class="pdf-loading">Could not load PDF. <a href="' + url + '" download style="color:#fff;text-decoration:underline;">Download it here</a>.</p>';
  });
})();
</script>

<!-- VISITOR TRACKING -->
<script>
(function() {
  var topic = 'meetaaron-999f7ff5edfaf3d0';
  var ref = document.referrer || 'Direct visit (no referrer)';
  var ua = navigator.userAgent || '';
  var page = location.pathname;
  var lang = navigator.language || 'unknown';
  var sz = window.screen ? (window.screen.width + 'x' + window.screen.height) : 'unknown';
  var now = new Date();
  var time = now.toLocaleString('en-US', { timeZone: 'America/Toronto' });

  var browser = 'Unknown';
  if (ua.indexOf('Edg') > -1) browser = 'Edge';
  else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
  else if (ua.indexOf('Safari') > -1) browser = 'Safari';
  else if (ua.indexOf('Firefox') > -1) browser = 'Firefox';

  var device = 'Desktop';
  if (/iPhone|iPad|iPod/.test(ua)) device = 'iOS';
  else if (/Android/.test(ua)) device = 'Android';
  else if (/Mobile/.test(ua)) device = 'Mobile';

  var msg = 'Page: ' + page
    + '\nTime: ' + time + ' (ET)'
    + '\nReferrer: ' + ref
    + '\nDevice: ' + device + ' / ' + browser
    + '\nScreen: ' + sz
    + '\nLanguage: ' + lang;

  var url = 'https://ntfy.sh/' + topic;
  var sent = false;

  // Method 1: fetch
  if (window.fetch) {
    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: msg
    }).catch(function() {});
    sent = true;
  }

  // Method 2: sendBeacon fallback
  if (!sent && navigator.sendBeacon) {
    navigator.sendBeacon(url, msg);
  }
})();
</script>
